data:
  n_samples: 1000
  n_features: 20
  n_informative: 5
  n_redundant: 0
  n_repeated: 0
  n_classes: 2
  test_size: 0.2
  random_state: 42

model:
  model_type: "logistic_regression"
  
  logistic_regression:
    C: 1.0
    max_iter: 100
    solver: "lbfgs"

  decision_tree:
    max_depth: 10
    min_samples_split: 2
    min_samples_leaf: 1
    random_state: 42

  random_forest:
    max_depth: 10
    n_estimators: 100
    min_samples_split: 2
    min_samples_leaf: 1
    random_state: 42
